name: zeta-sync-rebuild

on:
  schedule:
    # +15 menit setelah audit Zeta 22:00, 01:00, 08:00 WIB
    - cron: '15 15 * * *'
    - cron: '15 18 * * *'
    - cron: '15 1 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: zeta-sync-rebuild
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Regression tests
        if: github.event_name == 'workflow_dispatch'
        run: python -m pytest -q

      - name: Canonical Zeta member sync
        run: python backend/zeta_sync.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
          ZETA_MEMBER_COOKIE: ${{ secrets.ZETA_MEMBER_COOKIE }}

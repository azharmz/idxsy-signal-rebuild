name: rebuild-ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'web/**'
      - 'tests/**'
      - 'supabase/migrations/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'web/**'
      - 'tests/**'
      - 'supabase/migrations/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: >-
          python -m py_compile
          backend/telegram_parser.py
          backend/telegram_ingest.py
          backend/reconciliation.py
          backend/outcome_resolver.py
          backend/zeta_sync.py
          backend/zeta_late_bind_reconcile.py
          backend/rpc_regression.py
          backend/preflight.py
          backend/canonical_integrity_verify.py
          scripts/build_cloudflare_pages.py
      - name: Validate Cloudflare Pages frontend build
        run: python scripts/build_cloudflare_pages.py

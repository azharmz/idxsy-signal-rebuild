name: frontend-pages

# Deployment is prepared but manual-only until Pages is enabled for this repo.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage single-file frontend against canonical Supabase
        run: |
          mkdir -p dist
          python - <<'PY'
          from pathlib import Path

          src = Path('web/idxsy-signal.html').read_text(encoding='utf-8')
          src = src.replace('https://gfxhtpqzebxycijdnpjp.supabase.co', 'https://wshtfqqusiifdkqqoejs.supabase.co')
          src = src.replace('sb_publishable_BXkSOULyV06I6N6DhIIAdw_TJXQUGOS', 'sb_publishable_45BjutlMC-tHSoS-lGXIUQ_AOIuqF1y')

          if 'gfxhtpqzebxycijdnpjp.supabase.co' in src or 'sb_publishable_BXkSOULyV06I6N6DhIIAdw_TJXQUGOS' in src:
              raise SystemExit('Legacy Supabase frontend config still present after replacement')
          if 'wshtfqqusiifdkqqoejs.supabase.co' not in src or 'sb_publishable_45BjutlMC-tHSoS-lGXIUQ_AOIuqF1y' not in src:
              raise SystemExit('Canonical Supabase frontend config missing')

          Path('dist/index.html').write_text(src, encoding='utf-8')
          Path('dist/idxsy-signal.html').write_text(src, encoding='utf-8')
          PY
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

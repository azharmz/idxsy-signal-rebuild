name: telegram-smoke-rebuild

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Recent window in days for smoke test'
        required: true
        type: string
        default: '1'
      max_messages:
        description: 'Maximum contiguous messages to process'
        required: true
        type: string
        default: '5'

jobs:
  smoke:
    runs-on: ubuntu-latest
    concurrency:
      group: telegram-smoke-rebuild
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Regression tests
        run: python -m pytest -q

      - name: Bounded canonical Telegram smoke
        run: python backend/telegram_smoke.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TG_GROUP_ID: ${{ secrets.TG_GROUP_ID }}
          TG_TOPIC_ID: ${{ secrets.TG_TOPIC_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
          BACKFILL_SINCE_DAYS: ${{ inputs.backfill_days }}
          SMOKE_MAX_MESSAGES: ${{ inputs.max_messages }}
          EDIT_RESCAN_DAYS: '0'
          INGEST_CURSOR_SOURCE: 'telegram_group'

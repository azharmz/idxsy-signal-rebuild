name: zeta-smoke-rebuild

# Manual-only bounded smoke test. Never scheduled.
on:
  workflow_dispatch:
    inputs:
      max_rows:
        description: 'Maximum Zeta Member API rows to process'
        required: true
        type: string
        default: '5'

jobs:
  smoke:
    runs-on: ubuntu-latest
    concurrency:
      group: zeta-smoke-rebuild
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Regression tests
        run: python -m pytest -q

      - name: Bounded canonical Zeta smoke
        run: python backend/zeta_smoke.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
          ZETA_MEMBER_COOKIE: ${{ secrets.ZETA_MEMBER_COOKIE }}
          ZETA_SMOKE_MAX_ROWS: ${{ inputs.max_rows }}
